<button [matMenuTriggerFor]="userMenu"
        [matTooltip]="fullName()"
        class="w-10 h-10 rounded-full bg-indigo-600 hover:bg-indigo-700
               text-white text-sm font-semibold
               flex items-center justify-center
               transition-colors cursor-pointer border-0">
  {{ initials() }}
</button>

<mat-menu #userMenu="matMenu">
  <div class="px-4 py-3 border-b border-gray-100">
    <p class="text-sm font-semibold text-gray-800">{{ fullName() }}</p>
    <p class="text-xs text-gray-500">{{ email() }}</p>
  </div>
  <button mat-menu-item (click)="logout.emit(true)">
    <mat-icon>logout</mat-icon>
    Logout
  </button>
</mat-menu>
